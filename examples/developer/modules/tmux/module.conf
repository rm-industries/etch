{'schema_version': 1,
 'name': 'tmux',
 'facts': {'version': {'version': {'command': ['tmux', '-V']}}},
 'actions': [{'link': {'~/.tmux.conf': {'path': 'files/modern.conf', 'create': True}},
              'when': {'fact': {'name': 'version', 'matches': '>=3.0'}}},
             {'link': {'~/.tmux.conf': {'path': 'files/legacy.conf', 'create': True}},
              'when': {'fact': {'name': 'version', 'matches': '<3.0'}}}]}
