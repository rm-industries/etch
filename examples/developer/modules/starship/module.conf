{
  'schema_version': 1,
  'name': 'starship',
  'facts': {
    'available': {
      'provider': 'command',
      'config': 'starship',
    },
    'version': {
      'provider': 'version',
      'command': ['starship', '--version'],
    },
  },
  'actions': [
    {
      'installer': {
        'url': 'https://example.invalid/etch/starship-install',
        'check': {
          'command': 'starship',
        },
      },
      'refresh': ['available', 'version'],
    },
    {
      'link': {
        '~/.config/starship.toml': {
          'path': 'files/starship.toml',
          'create': True,
        },
      },
      'when': {
        'fact': {
          'name': 'version',
          'matches': '>=1.0',
        },
      },
    },
  ],
}
