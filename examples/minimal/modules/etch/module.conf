{
  'schema_version': 1,
  'name': 'etch',
  'actions': [
    {
      'link': {
        '~/.local/bin/etch': {
          'path': 'etch',
          'source_scope': 'repo',
          'create': True,
          'relink': True,
        },
      },
      'when': {
        'not': {
          'os': 'windows',
        },
      },
    },
    {
      'link': {
        '~/.local/bin/etch.ps1': {
          'path': 'etch.ps1',
          'source_scope': 'repo',
          'create': True,
          'relink': True,
        },
        '~/.local/bin/etch.cmd': {
          'path': 'etch.cmd',
          'source_scope': 'repo',
          'create': True,
          'relink': True,
        },
      },
      'when': {
        'os': 'windows',
      },
    },
    {
      'script': {
        'path': 'add-user-path.ps1',
        'check': {
          'file_exists': '~/.local/state/etch/windows-user-path',
        },
      },
      'when': {
        'os': 'windows',
      },
    },
  ],
}
