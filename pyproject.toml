[tool.ruff]
target-version = "py39"
extend-include = ["etch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.9"
files = ["etchlib", "tests", "etch"]
strict = true
check_untyped_defs = true
