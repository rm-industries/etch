---
name: Setup project
description: Set up Node.js and install project dependencies deterministically

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '26.x'
  project-directory:
    description: Project directory relative to the repository root
    required: false
    default: website

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.project-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ inputs.project-directory }}
