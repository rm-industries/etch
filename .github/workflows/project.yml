---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  schedule:
    - cron: '15 6 * * 3'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  python-format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt ruff
      - run: ruff format --check .
      - run: python -S etch format --check --repo examples/minimal
      - run: python -S etch format --check --repo examples/developer
  python-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt ruff
      - run: ruff check .
  python-typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt mypy
      - run: python -m mypy etchlib plugins tests etch
  python-test:
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt pytest
      - run: python -m pytest
      - run: python -S -m unittest discover -v
      - run: python -S etch --version
      - name: Diagnose the example in an isolated home
        run: |
          python -S - <<'PYTHON'
          import os, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as home:
              subprocess.run(
                  [sys.executable, "-S", "etch", "doctor", "--repo", "examples/minimal", "--profile", "developer"],
                  env=dict(os.environ, HOME=home), check=True,
              )
          PYTHON

  windows-baseline:
    name: Windows runtime and provider contract (Python ${{ matrix.python }})
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Shared core regression tests
        run: >-
          python -S -m unittest
          tests.test_action_graph tests.test_conditions tests.test_versions
          tests.test_provider_records tests.test_provider_registry tests.test_output
          tests.test_installer_home -v
      - name: Native Windows providers and consumer profile
        run: >-
          python -S -m unittest
          tests.test_platform_baseline tests.test_windows_filesystem
          tests.test_windows_commands tests.test_windows_installers
          tests.test_windows_registry tests.test_windows_profile -v
      - run: python -S etch --version

  template-consumer:
    permissions:
      contents: read
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.selection }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
        selection: [profile, git]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rm-industries/etch-template
          ref: 354d6e06bcf3f4c57269f60686f7520d31d90acb
          path: consumer
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the candidate engine with the template
        run: bash tests/template_consumer_smoke.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/consumer" "${{ matrix.selection }}"

  release-candidate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Verify reproducible source archive and clean startup
        run: bash tests/release_source_smoke.sh

  project-gate:
    name: Project
    needs:
      - python-format
      - python-lint
      - python-typecheck
      - python-test
      - windows-baseline
      - template-consumer
      - release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "All project checks passed."

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [project-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Verify release tag and clean checkout
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must be a stable vMAJOR.MINOR.PATCH version.' >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          test "$(python3 -S -c 'from etchlib import __version__; print(__version__)')" = "$version"
          test "$(python3 -S etch --version)" = "Etch $version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and verify source archive
        run: bash tests/release_source_smoke.sh "etch-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          read -r schema api < <(python3 -S -c 'from etchlib import SCHEMA_VERSION, PLUGIN_API_VERSION; print(SCHEMA_VERSION, PLUGIN_API_VERSION)')
          plugins=$(python3 -S - <<'PYTHON'
          from plugins.homebrew.etch_plugin import PLUGIN as homebrew
          from plugins.macos_defaults.etch_plugin import PLUGIN as macos_defaults
          from plugins.vscode.etch_plugin import PLUGIN as vscode
          from plugins.windows_registry.etch_plugin import PLUGIN as windows_registry

          print(", ".join("{} {} (API {})".format(plugin["name"], plugin["version"], plugin["api"]) for plugin in (homebrew, macos_defaults, vscode, windows_registry)))
          PYTHON
          )
          notes="Supported: Linux and macOS, Python 3.9–3.14; Windows 11 x64, Python 3.9 and 3.14 under docs/windows.md. Configuration schema: ${schema}; plugin API: ${api}.

          Reference plugins: ${plugins}.

          Known limits: Windows support is limited to the contract in docs/windows.md; no package solving, automatic engine or module updates, or general lifecycle hooks. Full compatibility details are in docs/compatibility.md at this tag."
          gh release create "$GITHUB_REF_NAME" "etch-${version}.tar.gz" "etch-${version}.tar.gz.sha256" \
            --verify-tag --fail-on-no-commits --generate-notes --notes "$notes" --title "Etch ${version}"
