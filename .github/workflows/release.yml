name: Source release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/test.yml

  template:
    uses: ./.github/workflows/template-consumer.yml

  publish:
    needs: [quality, template]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.9'
      - name: Verify release tag and clean checkout
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must be a stable vMAJOR.MINOR.PATCH version.' >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          test "$(python3 -S -c 'from etchlib import __version__; print(__version__)')" = "$version"
          test "$(python3 -S etch --version)" = "Etch $version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and verify source archive
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="etch-${version}.tar.gz"
          git archive --format=tar --prefix="etch-${version}/" "$GITHUB_SHA" | gzip -n > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          test "$(python3 -S "unpacked/etch-${version}/etch" --version)" = "Etch $version"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          read -r schema api < <(python3 -S -c 'from etchlib import SCHEMA_VERSION, PLUGIN_API_VERSION; print(SCHEMA_VERSION, PLUGIN_API_VERSION)')
          notes="Supported: Linux and macOS, Python 3.9–3.14. Configuration schema: ${schema}; plugin API: ${api}.

          Known limits: no Windows support, package solving, automatic engine or module updates, or general lifecycle hooks. Reference plugins have independent versions. Full compatibility details are in docs/compatibility.md at this tag."
          gh release create "$GITHUB_REF_NAME" "etch-${version}.tar.gz" "etch-${version}.tar.gz.sha256" \
            --verify-tag --fail-on-no-commits --generate-notes --notes "$notes" --title "Etch ${version}"
