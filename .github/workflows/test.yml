name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt ruff
      - run: ruff format --check .
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt ruff
      - run: ruff check .
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/constraints.txt mypy
      - run: python -m mypy etchlib plugins tests etch
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt pytest
      - run: python -m pytest
      - run: python -S -m unittest discover -v
      - run: python -S etch --version
      - name: Diagnose the example in an isolated home
        run: |
          python -S - <<'PYTHON'
          import os, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as home:
              subprocess.run(
                  [sys.executable, "-S", "etch", "doctor", "--repo", "examples/minimal", "--profile", "developer"],
                  env=dict(os.environ, HOME=home), check=True,
              )
          PYTHON
