---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - rahul0705
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /website
    assignees:
      - rahul0705
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: UTC
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - npm
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
